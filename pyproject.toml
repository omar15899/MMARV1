[project]
name = "mmar"
version = "2.0.0"
description = "Multifractal formalism engine: Holder spectra, cascade models and MMAR, with content-addressed provenance."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Omar Khalil" }]
keywords = [
    "multifractal",
    "holder-exponent",
    "singularity-spectrum",
    "MFDFA",
    "wavelet-leaders",
    "WTMM",
    "MMAR",
    "MSM",
    "fractional-brownian-motion",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
wavelets = ["PyWavelets>=1.5"]
data = ["pandas>=2.1"]
viz = ["matplotlib>=3.8"]
full = ["PyWavelets>=1.5", "pandas>=2.1", "matplotlib>=3.8"]

[project.scripts]
mmar = "mmar.cli:main"

[project.urls]
Repository = "https://github.com/TheVaccinator/MMARV1"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
    "PyWavelets>=1.5",
    "pandas>=2.1",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmar"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "NPY", "PL"]
ignore = ["PLR0913", "PLR2004", "PLR0912", "PLR0915", "N803", "N806", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = []
mypy_path = "src"
packages = ["mmar"]

[[tool.mypy.overrides]]
module = ["pywt.*", "matplotlib.*", "pandas.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "slow: long-running statistical validation (deselect with -m 'not slow')",
    "theory: validates an estimator against a closed-form theoretical result",
    "stochastic: uses randomness; must be seeded and reproducible",
]
filterwarnings = ["error::RuntimeWarning"]
